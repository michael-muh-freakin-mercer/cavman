[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cavman"
version = "0.2.0"
description = "Cavman: type what you want, Cavman builds it. Durable, verified multi-agent software delivery."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agents", "llm", "orchestration", "code-generation", "sandbox", "multi-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "openai-agents>=0.22.3,<0.23",
  "pydantic>=2.13.5",
  "python-dotenv>=1.2.3",
  "fastapi>=0.141.1,<1",
  "uvicorn>=0.54.0,<1",
  # PostgreSQL for multi-host deployments (CAVMAN_DATABASE_URL); SQLite otherwise.
  "psycopg[binary]>=3.3.6,<4",
  # Trusted validation runs pytest inside the sandbox from this environment.
  "pytest>=9.1.1",
  # Paid plans (STRIPE_SECRET_KEY); pinned to one major for its API version.
  "stripe>=16,<17",
]

[project.urls]
Homepage = "https://github.com/michael-muh-freakin-mercer/cavman"
Documentation = "https://github.com/michael-muh-freakin-mercer/cavman/blob/main/docs/ENGINE.md"
Changelog = "https://github.com/michael-muh-freakin-mercer/cavman/blob/main/CHANGELOG.md"
Issues = "https://github.com/michael-muh-freakin-mercer/cavman/issues"

[project.scripts]
cavman = "cavman.cli:main"
# Compatibility entrypoint for the orchestration core's operator CLI.
walter = "walter.cli:main"

[project.optional-dependencies]
test = ["httpx>=0.28.1"]
# CAVMAN_SANDBOX_BACKEND=e2b: run candidate code in E2B microVMs.
e2b = ["e2b>=2.51,<3"]
# SENTRY_DSN: report API and worker errors to Sentry.
sentry = ["sentry-sdk[fastapi]>=2.40,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "live: opt-in credit-bearing provider smoke test",
  "e2b: opt-in tests against real E2B microVMs (CAVMAN_E2B_LIVE=1 and E2B_API_KEY)",
]
