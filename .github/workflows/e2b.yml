name: E2B sandbox

# Builds the E2B template and runs the live E2B tests (tests/test_sandbox_e2b_live.py)
# against real microVMs. Spends E2B credit, so it runs only when the sandbox code
# changes, or by hand. Pull requests and pushes build and test a separate
# "cavman-sandbox-ci" template; the production template ("cavman-sandbox")
# is only rebuilt by a manual run with "publish" ticked.

on:
  pull_request:
    paths:
      - src/walter/sandbox.py
      - src/walter/sandbox_e2b.py
      - src/cavman/sandbox_probe.py
      - scripts/e2b_template.py
      - tests/test_sandbox_e2b_live.py
      - .github/workflows/e2b.yml
  push:
    branches: [main]
    paths:
      - src/walter/sandbox.py
      - src/walter/sandbox_e2b.py
      - src/cavman/sandbox_probe.py
      - scripts/e2b_template.py
      - tests/test_sandbox_e2b_live.py
      - .github/workflows/e2b.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Also rebuild the production template (cavman-sandbox) after the tests pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2b-template
  cancel-in-progress: false

jobs:
  live:
    name: E2B template and live tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      CAVMAN_E2B_TEMPLATE: cavman-sandbox-ci
    steps:
      - name: Require the E2B_API_KEY secret
        run: |
          if [ -z "$E2B_API_KEY" ]; then
            echo "::error::Set the E2B_API_KEY repository secret to run the E2B tests."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Cavman with the E2B SDK
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[test,e2b]'
      - name: Build the CI template
        run: .venv/bin/python scripts/e2b_template.py --name "$CAVMAN_E2B_TEMPLATE"
      - name: Live E2B tests
        env:
          CAVMAN_E2B_LIVE: "1"
        run: .venv/bin/python -m pytest -q -m e2b -rs tests/test_sandbox_e2b_live.py
      - name: Publish the production template
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: .venv/bin/python scripts/e2b_template.py --name cavman-sandbox
