name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: backend suite
    # Pinned rather than ubuntu-latest: the label migrates to Ubuntu 26 on
    # 2026-10-19, and a runner-image change should be a deliberate commit here,
    # not a red build with no code change behind it.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cavman
          POSTGRES_PASSWORD: cavman
          POSTGRES_DB: cavman
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cavman" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install the isolation backend and the system interpreter
        # Walter's sandbox fails closed without bubblewrap and libseccomp, so the
        # sandbox tests cannot run at all on a runner that lacks them.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap libseccomp2 util-linux python3-venv

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
        # which breaks bubblewrap. The suite below is what proves whether this
        # worked; do not let it fail silently.
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Report the host layout
        run: |
          python3 -VV
          ls -l /usr/bin/bwrap /usr/bin/prlimit
          python3 -c "import ctypes; ctypes.CDLL('libseccomp.so.2'); print('libseccomp resolves')"
          ls -ld /lib /lib64 /usr/lib64 || true

      - uses: actions/setup-node@v7
        with:
          # The sandboxed Node toolchain needs Node 22+ (type stripping, in-process test isolation).
          node-version: 22

      - name: Install Cavman (API, worker and orchestration core)
        # Deliberately the distribution interpreter, not a toolcache one. The
        # sandbox binds /usr into an environment-cleared namespace, so the
        # interpreter has to be self-contained under that tree; toolcache builds
        # need LD_LIBRARY_PATH to find their own libpython, which a cleared
        # environment cannot supply.
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[test]'

      - name: Offline suite
        run: .venv/bin/python -m pytest -q

      - name: API, worker and stores on PostgreSQL
        env:
          CAVMAN_TEST_DATABASE_URL: postgresql://cavman:cavman@127.0.0.1:5432/cavman
        run: .venv/bin/python -m pytest -q tests/test_cavman_api.py tests/test_postgres.py tests/test_migrate.py

      - name: Monitoring config and alert rules
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/etc/prometheus" --entrypoint sh prom/prometheus:v3.15.0 -c \
            'echo token > /tmp/token && sed "s#/etc/prometheus/cavman-metrics-token#/tmp/token#" /etc/prometheus/prometheus.yml > /tmp/p.yml \
             && cp /etc/prometheus/alerts.yml /tmp/ && promtool check config /tmp/p.yml \
             && cd /etc/prometheus && promtool test rules alerts_test.yml'

      - name: Offline evaluation scenarios
        run: .venv/bin/python evals/runner.py

      - name: Secret scan
        # Any secret-like string not audited into .secrets.baseline fails the build.
        run: |
          .venv/bin/python -m pip install "detect-secrets==1.5.0"
          PATH="$PWD/.venv/bin:$PATH" .venv/bin/python scripts/check_secrets.py

      - name: Dependency audit (Python)
        run: |
          .venv/bin/python -m pip install pip-audit
          .venv/bin/pip-audit --skip-editable

  next-runner:
    name: backend suite on Ubuntu 26.04 (advisory)
    # The rehearsal for moving off ubuntu-24.04 (docs/runbooks/ci-runner-move.md).
    # Advisory: it never fails the build, and it is not a required check. When it
    # has been green for a week, move the pinned jobs over in one commit.
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install the isolation backend and the system interpreter
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap libseccomp2 util-linux python3-venv
      - name: Allow unprivileged user namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Report the host layout
        run: |
          python3 -VV
          ls -l /usr/bin/bwrap /usr/bin/prlimit
          python3 -c "import ctypes; ctypes.CDLL('libseccomp.so.2'); print('libseccomp resolves')"
          stat -fc %T /sys/fs/cgroup
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Cavman
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[test]'
      - name: Offline suite
        run: .venv/bin/python -m pytest -q

  github-live:
    name: import from the real github.com (advisory)
    # Every other importer test uses a local stand-in for GitHub; this one uses
    # github.com itself, so a GitHub outage must not fail the build.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install Cavman
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[test]'
      - name: Import public repositories from github.com
        env:
          CAVMAN_LIVE_GITHUB: "1"
          # Raises GitHub's rate limit; the import itself stays public-only.
          CAVMAN_GITHUB_IMPORT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .venv/bin/python -m pytest -q tests/test_github_live.py

  web:
    name: web (typecheck, lint, unit, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm test
      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BETTER_AUTH_SECRET: ci-build-only-secret-0123456789abcdef
          CAVMAN_AUTH_AUTO_MIGRATE: "0"
        run: npm run build

  e2e:
    name: end-to-end journeys
    runs-on: ubuntu-24.04
    needs: [suite, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the isolation backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap libseccomp2 util-linux python3-venv
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Cavman
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[test]'
      - name: Install web dependencies and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Run journeys
        working-directory: web
        env:
          CI: "1"
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
  deploy:
    name: compose deployment on PostgreSQL
    # The real images (deploy/*.Dockerfile) as compose.yaml wires them, with
    # auth and operational state in Postgres and two workers sharing the queue,
    # driven through the same journeys as the e2e job.
    runs-on: ubuntu-24.04
    needs: [suite, web]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Allow unprivileged user namespaces
        # The worker containers' Bubblewrap sandbox needs them, as on a VM.
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install web dependencies and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build, start and exercise the stack
        env:
          CI: "1"
        run: deploy/e2e.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: deploy-playwright-report
          path: web/playwright-report
          retention-days: 7
  backup:
    name: backup and restore drill
    # deploy/backup/ against a real PostgreSQL and `rclone serve s3` in place of Spaces:
    # encrypted upload, retention pruning, and a full restore that is checked
    # row by row and file by file.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cavman
          POSTGRES_PASSWORD: cavman
          POSTGRES_DB: cavman
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cavman" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install age
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends age
      - name: Lint the scripts
        run: shellcheck -x -P SCRIPTDIR deploy/backup/*.sh
      - name: Build the API image
        # The drill runs `cavman ops list` from it against the restored copy.
        run: docker build -f deploy/api.Dockerfile -t cavman-backup-api .
      - name: Back up, prune and restore
        env:
          CAVMAN_TEST_API_IMAGE: cavman-backup-api
        run: deploy/backup/ci-test.sh
  logs:
    name: log shipper in the production overlay
    # The alloy service from compose.prod.yaml, run as production runs it,
    # pushing to a stand-in for Loki: it stays up, ships marked containers with
    # the right labels and credentials, and leaves other containers out.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Lint the script
        run: shellcheck deploy/logs/*.sh
      - name: Ship logs to a stand-in
        run: deploy/logs/ci-test.sh
